[project]
name = "pebble-worker"
version = "0.1.0"
description = "Pebble local worker: private, on-device audio processing for the Pebble web app."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "pydantic==2.13.5",
    "python-multipart==0.0.32",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
# Real speech recognition (M1). Install with: UV_CACHE_DIR=~/.pebble/uv-cache uv sync --extra funasr
# torch and torchaudio are a deliberately matched pair. See docs/MODELS.md.
funasr = [
    "funasr==1.4.16",
    "modelscope==1.40.1",
    "torch==2.11.0",
    "torchaudio==2.11.0",
]

[project.scripts]
pebble-worker = "pebble_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pebble_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Full-width parentheses are intentional in Chinese text.
allowed-confusables = ["（", "）", "–"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.uv]
# funasr declares `transformers` with no lower bound, and the resolver would otherwise fall back to
# ancient releases that need a Rust source build. FunASR imports transformers during package
# initialization because optional FunASR modules use it; Pebble's selected Paraformer, FSMN-VAD
# and ct-punc-c paths do not require Transformers model features at runtime. Constraint only.
constraint-dependencies = ["transformers>=4.32.0,<5"]
